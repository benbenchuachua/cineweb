<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore movies and actors in 3D — wander cast lists and filmographies." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ebf1f9" />
    <title>CineWeb — 3D Movie & Actor Explorer</title>
    <script>
      try {
        var p = new URLSearchParams(location.search).get("path");
        var s = sessionStorage.getItem("cineweb-session-path");
        if ((p && p.length > 1) || (s && s.length > 1)) {
          document.documentElement.dataset.restoring = "true";
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
